# Watch the CachyOS BORE patch upstream and flag drift against the
# vendored patch. Dormant until this repo is pushed to GitHub.
name: patch-watch

on:
  schedule:
    - cron: "17 7 * * *" # daily, off the hour to be nice to the API
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bore-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored patch matches PATCH_VERSION
        run: |
          set -euo pipefail
          source kernel/PATCH_VERSION
          actual="$(sha256sum "kernel/${patch_file#patches/}" | awk '{print $1}')"
          echo "state:    $sha256"
          echo "actual:   $actual"
          [[ "$actual" == "$sha256" ]] || {
            echo "::error::PATCH_VERSION sha256 does not match the vendored patch."
            exit 1
          }

      - name: Check upstream for drift
        run: kernel/check-upstream.sh
        # Exit code 1 = upstream drift (action goes red = signal to re-vendor)
        # Exit code 3 = upstream unreachable (treated as failure to investigate)
