# The RootCellar start menu (TUI: `cellar app`).
# GUI apps are also reachable from the mouse launcher (Ctrl+Alt+D -> fuzzel
# drun) and the start menu (Ctrl+Alt+Space). Optional apps must ALSO be
# listed under [apps.optional] so `cellar list` can flag what is not
# installed. See docs/CONVENIENT-DESKTOP.md.

[apps]

[f]
name = "Files"
command = "nautilus"

[e]
name = "Text editor"
command = "gnome-text-editor"

[c]
name = "Calculator"
command = "gnome-calculator"

[s]
name = "System monitor"
command = "gnome-system-monitor"

[i]
name = "Images"
command = "loupe"

[a]
name = "Archives"
command = "file-roller"

[g]
name = "Settings"
command = "gnome-control-center"

[m]
name = "Monitor (TUI)"
command = "btop"

[v]
name = "Neovim"
command = "nvim"

[y]
name = "Yazi"
command = "yazi"

[l]
name = "Lazygit"
command = "lazygit"

[d]
name = "Lazydocker"
command = "lazydocker"

[t]
name = "Fetch"
command = "fastfetch"

[n]
name = "Notes"
command = "nvim ~/.local/share/cellar/notes.md"

[o]
name = "Desktop overlay"
command = "cellar overlay"
