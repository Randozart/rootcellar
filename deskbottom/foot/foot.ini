# RootCellar foot terminal configuration.
# Deployed to /etc/cellar/foot/foot.ini; see PLAN-HYPRDESK.md.
[main]
font=DejaVu Sans Mono:size=11
dpi-aware=yes

[colors]
# Alpha baked into the color hex (cc = 80%): the standalone `alpha` key
# is not applied by this foot build, and 92% was visually indistinguish-
# able from opaque over the dark wallpaper anyway.
background=191622cc
foreground=F5F3F1

# Normal colors
regular0=2A2438
regular1=D0879A
regular2=6FBFAD
regular3=D8C77A
regular4=5277C3
regular5=A06BE0
regular6=7EBAE5
regular7=F5F3F1

# Bright colors
bright0=6c6a8a
bright1=D0879A
bright2=6FBFAD
bright3=D8C77A
bright4=5277C3
bright5=A06BE0
bright6=7EBAE5
bright7=F5F3F1

[cursor]
style=block
blink=yes
