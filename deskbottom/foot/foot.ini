# RootCellar foot terminal configuration.
# Deployed to /etc/xdg/foot/foot.ini — foot only reads XDG_CONFIG_HOME
# and XDG_CONFIG_DIRS locations and never looks at /etc/foot; see
# PLAN-HYPRDESK.md. Validate with: foot -c <file> --check-config
[main]
# JetBrains Mono, not DejaVu Sans Mono: Zellij's tab-bar and status-bar
# draw the Powerline separator U+E0B0 between tabs and hint groups, and
# DejaVu has no Private Use Area at all, so it rendered as tofu. JetBrains
# Mono carries Powerline (e0b0-e0b3) plus every box-drawing and arrow
# glyph natively — one font, no fallback. (fontconfig's dynamic fallback
# never maps PUA codepoints, so installing a Nerd Font alone is not enough.)
font=JetBrains Mono:size=11
dpi-aware=yes

[colors]
# Per foot.ini(5): colors are plain RRGGBB (no alpha component) and
# translucency is this separate float key. Verified with --check-config.
alpha=0.8
background=191622
foreground=F5F3F1

# Normal colors
regular0=2A2438
regular1=D0879A
regular2=6FBFAD
regular3=D8C77A
regular4=5277C3
regular5=A06BE0
regular6=7EBAE5
regular7=F5F3F1

# Bright colors
bright0=6c6a8a
bright1=D0879A
bright2=6FBFAD
bright3=D8C77A
bright4=5277C3
bright5=A06BE0
bright6=7EBAE5
bright7=F5F3F1

[cursor]
style=block
blink=yes
