# Hyprland — the cellar's window manager (headless, streamed via noVNC).
# Deployed to /etc/cellar/hypr/hyprland.conf; see PLAN-HYPRDESK.md.
# Escape hatch: SUPER+SHIFT+E exits the compositor; the Windows side is
# always reachable via Alt+F4 on the kiosk overlay.

monitor=HEADLESS-1,1920x1080@60,0,0

# Create the virtual display wayvnc captures, then dock the RootCellar
# session: a terminal attached to the same Zellij session as the
# Windows-side WezTerm (multi-client shared view).
exec-once = hyprctl output create headless HEADLESS-1
exec-once = foot -e zellij attach cellar --create

# Terminal-heavy defaults: no animations, no blur — VNC bandwidth is the
# scarce resource, and a streamed desktop gains nothing from either.
animations {
    enabled = false
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1
    col.active_border = rgba(5277c3ee)
    col.inactive_border = rgba(6f6785aa)
}

input {
    # A VNC client is one keyboard/pointer; no tablet/touch plumbing.
    kb_layout = us
}

$mod = SUPER

bind = $mod, Return, exec, foot -e zellij attach cellar --create
bind = $mod, B, exec, firefox
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, E, togglesplit
bind = SUPER SHIFT, E, exit

# Focus movement
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Workspaces on the streamed output
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
