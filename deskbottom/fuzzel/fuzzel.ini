# RootCellar fuzzel configuration — the desk's launcher and action menus.
# Deployed to /etc/xdg/fuzzel/fuzzel.ini; fuzzel reads XDG_CONFIG_DIRS
# (/etc/xdg), unlike wofi 1.4.1 which only reads ~/.config/wofi.
# Catppuccin-mocha, Inter. See PLAN-KEYBINDS.md.

[main]
font=Inter:size=11
dpi-aware=no
prompt="› "
placeholder=Type to search…
lines=12
width=36
horizontal-pad=16
vertical-pad=8
inner-pad=4
line-height=20
icon-theme=Papirus-Dark
icons-enabled=yes
layer=overlay
anchor=center
terminal=foot -e

[colors]
# catppuccin-mocha; background is 87%-opaque base (the catppuccin convention)
background=1e1e2edd
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

[border]
width=1
radius=10